services:
  auto-poster:
    build: .
    restart: unless-stopped
    environment:
      - FEEDS=${FEEDS}
      - ECHOBRIDGE_URL=${ECHOBRIDGE_URL}
      - ECHOBRIDGE_API_TOKEN=${ECHOBRIDGE_API_TOKEN:-}
      - ACCOUNT_IDS=${ACCOUNT_IDS:-}
      - POLL_INTERVAL=${POLL_INTERVAL:-15m}
    volumes:
      - auto_poster_data:/data
    # No ports and no Traefik labels: the service only makes outbound requests.
    networks:
      - dokploy-network

volumes:
  auto_poster_data:

networks:
  dokploy-network:
    external: true
